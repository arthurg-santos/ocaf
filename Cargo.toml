[workspace]
members = ["crates/ocaf-core", "crates/ocaf-cli"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/arthurg-santos/ocaf"
authors = ["Arthur Santos"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
